[workspace]
resolver = "2"
members = ["crates/opentop-core", "crates/opentop-theme", "crates/opentop-widgets", "crates/opentop-cli", "crates/opentop-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Modern cross-platform system monitor: backend, themes and widgets"
repository = "https://github.com/tyou0/opentop"

[workspace.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "component", "network", "user"] }
starship-battery = "0.12"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
ratatui = "0.30"
toml = "1"
clap = { version = "4", features = ["derive"] }
netstat2 = "0.11"

[profile.release]
lto = "thin"
strip = true
